<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>assignment3</title>
    <style>
        .body {
            background-color: rgb(147, 213, 147);
        }

        .div{
            font-family: Arial, Helvetica, sans-serif;
             margin: 0 auto;
            text-align: center;
            padding: 5px;
            width:340px;
            height:220px;
            margin-top: 180px;
            border-radius: 15px;
            background-color: white;
        }

        .p{
           color: rgb(95, 95, 95);
        }
        
        .btn{
            background-color: blue;
            padding: 10px 20px;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body class="body">
    <div class="div">
        <h1>Color Changer</h1>
        <p class="p">clicl the button to change the background <br>color,</p>
        <button onclick="click()" class="btn">Change Color</button>
        <p id="follo"></p>
    </div>
    <script>
        
        let btn = document.getElementById("btn");

        btn.addEventListener("click",changecolor);

        function changecolor(){
            document.body.style.background = "#f63456"
        }
    </script>
</body>
</html>
